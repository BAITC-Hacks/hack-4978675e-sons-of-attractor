services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATASET_PATH: /service/backend/data/catalog.csv
      FACTS_PATH: /service/backend/data/facts.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PARSE_ENABLED: ${PARSE_ENABLED:-true}
      ANSWER_ENABLED: ${ANSWER_ENABLED:-true}
      PARSE_OPENAI_API_KEY: ${PARSE_OPENAI_API_KEY:-}
      PARSE_ANTHROPIC_API_KEY: ${PARSE_ANTHROPIC_API_KEY:-}
      ANSWER_OPENAI_API_KEY: ${ANSWER_OPENAI_API_KEY:-}
      ANSWER_ANTHROPIC_API_KEY: ${ANSWER_ANTHROPIC_API_KEY:-}
      PARSE_OPENAI_MODEL: ${PARSE_OPENAI_MODEL:-}
      PARSE_ANTHROPIC_MODEL: ${PARSE_ANTHROPIC_MODEL:-}
      ANSWER_OPENAI_MODEL: ${ANSWER_OPENAI_MODEL:-}
      ANSWER_ANTHROPIC_MODEL: ${ANSWER_ANTHROPIC_MODEL:-}
